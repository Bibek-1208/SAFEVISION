# SafeVision AI — Production & Deployment Compose Specification
# Includes MongoDB rs0 replica set, NVIDIA GPU deployment configuration,
# managed model weight volume, and strict health checks.

services:
  # 1. Native MongoDB Replica Set (rs0)
  mongodb:
    image: mongo:7.0
    container_name: safevision-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongodb:27017' }]
            }).ok
          }
        " || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 2. Python Computer Vision & Inference Service (GPU Capable)
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: safevision-ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - ./ai/models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health | grep -q 'READY' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. Node.js Express Core & Socket.IO WebSockets Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: safevision-backend
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - NODE_ENV=production
      - DEMO_MODE=${DEMO_MODE:-false}
      - MONGODB_URI=mongodb://mongodb:27017/safevision?replicaSet=rs0
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-safevision-prod-secret-replace-in-env}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  # 4. Web Command Center (Production React Build served via Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: safevision-web
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
